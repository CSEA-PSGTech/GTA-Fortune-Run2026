name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./fortune-run
          push: true
          tags: |
            ghcr.io/csea-psgtech/gta-fortune-run-frontend:latest
            ghcr.io/csea-psgtech/gta-fortune-run-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/csea-psgtech/gta-fortune-run-backend:latest
            ghcr.io/csea-psgtech/gta-fortune-run-backend:${{ github.sha }}